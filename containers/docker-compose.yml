# Two containers, one file (build plan §1). See DECISIONS.md D-013. A third, `anchors`, is the
# test stand-in for the off-host anchor destination (D-122).
name: juno

services:
  runner:
    build:
      context: ..
      dockerfile: containers/runner.Dockerfile
    image: juno-runner:local
    user: "1000:1000"
    network_mode: none          # no provider yet; Increment 5 opens provider endpoints only
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      JUNO_JOURNAL_DIR: /journal
      JUNO_WORK_DIR: /work
    volumes:
      - journal-vol:/journal    # §3.4.1: only the runner mounts the journal
      - work-vol:/work

  workload:
    build:
      context: ..
      dockerfile: containers/workload.Dockerfile
    image: juno-workload:local
    user: "65532:65532"
    network_mode: none          # never relaxed (CLAUDE.md §5)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Fixed resource limits (DECISIONS.md D-025 Inc 3, D-030). Swap equals
    # memory, so the memory limit cannot be stretched by swapping.
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    volumes:
      - work-vol:/work          # no journal-vol, no credentials

  # The test stand-in for the off-host anchor destination (§3.4.1, DECISIONS.md D-122). Only this service mounts
  # anchors-vol; its entrypoint offers append and list only. In the `anchors` profile: it is a store reached by
  # `docker compose run`, never a long-running service, so `docker compose up` leaves it alone.
  anchors:
    profiles: ["anchors"]
    build:
      context: ..
      dockerfile: containers/anchors.Dockerfile
    image: juno-anchors:local
    user: "65533:65533"
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - anchors-vol:/anchors

volumes:
  journal-vol:
  work-vol:
  anchors-vol:
