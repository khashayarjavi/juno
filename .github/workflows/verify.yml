name: verify

# Runs `make verify` on every pull request into main (DECISIONS.md D-007).
# A missing Makefile fails loudly: there is no "green by absence".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# The repository is public (the operator's choice, D-251; D-260). Every job runs with a read-only token: no step can
# write to the repository, whoever opened the pull request, a fork included. No secret is used anywhere, and the
# workflow never runs on `pull_request_target` (which would give a fork's code the base repository's token).
permissions:
  contents: read

# A new push to a pull request's branch cancels that branch's run still in progress: the superseded head is never
# merged, and the merge gate reads the run on the head it merges (CLAUDE.md §7 step 6b), which no later push cancels
# without moving the head, so the gate refuses it. Every other run (a push to main for each merge commit, a manual run)
# is in a group of its own, named by its own run id, so none is ever cancelled or replaced by another: §7 step 6d reads
# each merge's run (D-260, D-261).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history: test/evidence/upgrade.test.ts builds the commit installed on the operator's machine from it,
      # to prove the service starts on its old journal after an upgrade (DECISIONS.md D-222).
      # Third-party actions are pinned by full commit SHA (D-260), the tag they were resolved from in the comment. The
      # token is not kept in .git/config after checkout: no later step needs it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Require Makefile
        run: |
          if [ ! -f Makefile ]; then
            echo "::error::No Makefile. Increment 0 has not created the verification harness yet."
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::error::No package-lock.json. Commit the lockfile."
            exit 1
          fi

      # The kernel oracle's case-folded folder (DECISIONS.md D-178): an ext4 made with the casefold feature, mounted by
      # loop, owned by the test user. JUNO_CASEFOLD_REQUIRED makes the oracle fail if this folder is missing.
      - name: A case-folding folder for the kernel oracle (D-178)
        run: |
          truncate -s 64M "$RUNNER_TEMP/casefold.img"
          sudo mkfs.ext4 -q -F -O casefold "$RUNNER_TEMP/casefold.img"
          sudo mkdir -p /mnt/juno-casefold
          sudo mount -o loop "$RUNNER_TEMP/casefold.img" /mnt/juno-casefold
          sudo chown "$(id -u):$(id -g)" /mnt/juno-casefold
          echo "JUNO_CASEFOLD_ROOT=/mnt/juno-casefold" >> "$GITHUB_ENV"
          echo "JUNO_CASEFOLD_REQUIRED=1" >> "$GITHUB_ENV"

      - name: make verify
        run: make verify

  # The same container suite as the runner's unprivileged user under rootless Docker, on cgroup v2 with systemd
  # (DECISIONS.md D-130, D-131): the configuration the operator's WSL2 runs. A separate job, so `verify` stays the
  # plain Docker run it has always been; the merge gate (CLAUDE.md §7 step 6b) reads both.
  verify-rootless:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Set up the rootless runtime and the runner's user (as root)
        run: sudo bash scripts/rootless/setup-root.sh

      - name: make verify-rootless (as the runner's user)
        run: sudo env JUNO_NODE_BIN="$(dirname "$(command -v node)")" bash scripts/rootless/run-verify.sh

  # The operator's own setup (issue #56, DECISIONS.md D-219): Docker from Docker's apt repository at the guide's pinned
  # version with the root-run Docker switched off (guide Part E steps 3 and 4), the containerd snapshotter, and the
  # whole run in the runner's login shell (`sudo -iu juno-runner`, steps 8 and 11), where Ubuntu's umask is 0002.
  # `verify-rootless` above keeps the static binaries and umask 0022; the merge gate reads all three jobs.
  verify-rootless-operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Set up Docker as the guide does, rootless, and the runner's user (as root)
        run: sudo bash scripts/rootless/setup-root.sh --docker-from-apt

      - name: make verify-rootless (in the runner's login shell, umask 0002)
        run: sudo env JUNO_NODE_BIN="$(dirname "$(command -v node)")" bash scripts/rootless/run-verify.sh --login-shell
