name: verify

# Runs `make verify` on every pull request into main (DECISIONS.md D-007).
# A missing Makefile fails loudly: there is no "green by absence".

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Require Makefile
        run: |
          if [ ! -f Makefile ]; then
            echo "::error::No Makefile. Increment 0 has not created the verification harness yet."
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::error::No package-lock.json. Commit the lockfile."
            exit 1
          fi

      - name: make verify
        run: make verify
